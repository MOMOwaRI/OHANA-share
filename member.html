<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OHANAメンバー紹介ページ｜OHANAシェア＊プロジェクト</title>
<link rel="canonical" href="https://momowari.github.io/OHANA-share/member.html">
<link rel="icon" href="favicon.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q979YZ2WCW"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-Q979YZ2WCW');</script>
<style>
  :root{--orange:#e07b24;--orange-dark:#c2610f;--ink:#3a2e25;--paper:#fff9f2;--card:#fff;--line:#f3ddc4;--soft:#8a6a4f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;background:var(--paper);color:var(--ink);line-height:1.8}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}
  header{text-align:center;padding:28px 0 8px}
  .badge{display:inline-block;border-radius:999px;padding:2px 14px;font-size:.85rem;font-weight:bold;letter-spacing:.08em;color:#4a3418}
  .cat-hito{background:#f6c3d5}.cat-mono{background:#bfe6cf}.cat-koto{background:#fbe38e}
  h1{font-size:2.1rem;letter-spacing:.03em;margin:10px 0 0;line-height:1.3}
  .sub{color:var(--soft);font-size:.92rem;margin-top:2px}
  .tags{margin:10px 0 2px}
  .tag{display:inline-block;background:#fdeeda;border:1px solid var(--line);border-radius:999px;padding:1px 12px;margin:2px;font-size:.85rem}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
  h2{font-size:1.18rem;color:var(--orange-dark);margin-bottom:10px;border-left:5px solid var(--orange);padding-left:10px;letter-spacing:.04em}
  .chips{margin-bottom:6px}
  .chip{display:inline-block;border-radius:999px;padding:2px 14px;margin:2px;font-weight:bold;font-size:.88rem;color:#4a3418}
  .sns a{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);background:#fffdf9;margin-top:10px}
  .sns a b{color:var(--orange-dark)}
  .sns a:first-child{margin-top:0}
  .recruit{background:#fdf3e3;border:1.5px dashed #e8b96f;border-radius:16px;padding:20px;margin-top:16px;text-align:center}
  .recruit h2{border:none;padding:0;text-align:center}
  .recruit a{display:inline-block;margin-top:10px;background:var(--orange);color:#fff;font-weight:bold;text-decoration:none;border-radius:999px;padding:12px 26px}
  .cta{display:block;text-align:center;background:#fff;color:var(--orange-dark);border:2px solid var(--orange);font-weight:bold;text-decoration:none;border-radius:999px;padding:13px;margin-top:16px}
  .banner-sm{width:min(340px,86%);display:block;margin:24px auto 2px;border-radius:10px;border:1.5px solid #e8cdb0;background:#fff}
  footer{text-align:center;margin-top:16px;font-size:.85rem;color:var(--soft)}
  footer img{width:90px;display:block;margin:0 auto 8px}
  .empty{font-size:.9rem;color:var(--soft)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="img-992cf83a89.png" alt="OHANAキャラクター" style="width:110px">
    <div id="p-head" hidden>
      <div id="p-badges"></div>
      <h1 id="p-name"></h1>
      <p class="sub" id="p-area"></p>
      <div class="tags"><span class="tag">OHANAメンバー</span><span class="tag" id="p-no"></span></div>
    </div>
    <div id="p-loading"><p class="sub">読み込んでいます…</p></div>
    <div id="p-notfound" hidden><p class="sub">このメンバーのページはまだ準備中です。</p></div>
  </header>

  <section id="s-intro" hidden><h2>紹介</h2><p id="p-intro"></p></section>

  <section id="s-seeking" hidden>
    <h2>探しているヒト・モノ・コト</h2>
    <div id="p-seeking"></div>
  </section>

  <section id="s-offering" hidden><h2>提供できること・ゆずれるもの</h2><p id="p-offering"></p></section>

  <section id="s-links" hidden>
    <h2>リンク集</h2>
    <div class="sns" id="p-links"></div>
  </section>

  <a class="cta" href="index.html">OHANAトップへ戻る</a>

  <img class="banner-sm" src="member-banner.png" alt="OHANAシェア＊プロジェクト">
  <footer>
    <img src="img-992cf83a89.png" alt="OHANAキャラクター">
    OHANAシェア＊プロジェクト OHANAメンバー紹介ページ
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCao64N8dfQoXBmsMHIDpLpQwQyXp-2iw0",
  authDomain: "ohana-share.firebaseapp.com",
  projectId: "ohana-share",
  storageBucket: "ohana-share.firebasestorage.app",
  messagingSenderId: "825904150210",
  appId: "1:825904150210:web:4ae90f047ac8cc761cad5b"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
function $(id){ return document.getElementById(id); }
function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl(t){ return esc(t).replace(/\n/g,'<br>'); }
var id = new URLSearchParams(location.search).get('id');
if(!id){ $('p-loading').hidden = true; $('p-notfound').hidden = false; }
else {
  db.collection('profiles').doc(id).get().then(function(doc){
    $('p-loading').hidden = true;
    if(!doc.exists){ $('p-notfound').hidden = false; return; }
    var d = doc.data();
    $('p-head').hidden = false;
    var dcats = d.categories || (d.category ? [d.category] : []);
    var bh = '';
    dcats.forEach(function(c){
      bh += '<span class="badge ' + (c === 'ヒト' ? 'cat-hito' : c === 'モノ' ? 'cat-mono' : 'cat-koto') + '">' + esc(c) + '</span> ';
    });
    $('p-badges').innerHTML = bh;
    $('p-no').textContent = d.memberNo ? ('No.' + d.memberNo) : '';
    if(!d.memberNo){ $('p-no').style.display = 'none'; }
    $('p-name').textContent = d.nickname || 'OHANAメンバー';
    document.title = (d.nickname || 'OHANAメンバー') + '｜OHANAシェア＊プロジェクト OHANAメンバー紹介ページ';
    $('p-area').textContent = d.area || '';
    if(d.intro){ $('s-intro').hidden = false; $('p-intro').innerHTML = nl(d.intro); }
    var rows = '';
    if(d.seekingHito || d.seekingText) rows += '<p><span class="chip cat-hito">ヒトを探しています</span></p><p>' + nl(d.seekingHito || d.seekingText) + '</p>';
    if(d.seekingMono) rows += '<p style="margin-top:10px"><span class="chip cat-mono">モノを探しています</span></p><p>' + nl(d.seekingMono) + '</p>';
    if(d.seekingKoto) rows += '<p style="margin-top:10px"><span class="chip cat-koto">コトを探しています</span></p><p>' + nl(d.seekingKoto) + '</p>';
    if(rows){ $('s-seeking').hidden = false; $('p-seeking').innerHTML = rows; }
    if(d.offering){ $('s-offering').hidden = false; $('p-offering').innerHTML = nl(d.offering); }
    var links = '';
    if(d.hpUrl) links += '<a href="' + esc(d.hpUrl) + '" target="_blank" rel="noopener"><b>ホームページ</b></a>';
    if(d.menuUrl) links += '<a href="' + esc(d.menuUrl) + '" target="_blank" rel="noopener"><b>メニュー・料金ページ</b></a>';
    if(d.snsLinks){
      d.snsLinks.split(/\s+/).forEach(function(u){
        if(u.indexOf('http') === 0) links += '<a href="' + esc(u) + '" target="_blank" rel="noopener"><b>SNSリンク</b></a>';
      });
    }
    if(links){ $('s-links').hidden = false; $('p-links').innerHTML = links; }
  }).catch(function(){
    $('p-loading').hidden = true; $('p-notfound').hidden = false;
  });
}
</script>
</body>
</html>
