<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール編集｜OHANAシェア＊プロジェクト</title>
<link rel="canonical" href="https://momowari.github.io/OHANA-share/mypage.html">
<link rel="icon" href="favicon.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q979YZ2WCW"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-Q979YZ2WCW');</script>
<style>
  :root{--ink:#3a2e25;--paper:#fff9f2;--card:#fff;--line:#f3ddc4;--soft:#8a6a4f;--accent:#e07b24}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;background:var(--paper);color:var(--ink);line-height:1.8}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}
  header{text-align:center;padding:28px 0 4px}
  h1{font-size:1.45rem}
  .sub{color:var(--soft);font-size:.92rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:16px}
  label{display:block;font-weight:bold;margin:16px 0 4px}
  label:first-of-type{margin-top:0}
  .hint{font-size:.82rem;color:var(--soft);font-weight:normal}
  input[type=text],input[type=url],textarea{width:100%;border:1px solid #e5cfae;border-radius:10px;padding:10px;font-size:.95rem;font-family:inherit;background:#fffdf9}
  textarea{min-height:84px}
  .radios,.checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .radios label,.checks label{margin:0;font-weight:normal;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer;background:#fff}
  .radios input,.checks input{margin-right:6px}
  .savebtn{display:block;width:100%;margin-top:22px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px;font-size:1rem;font-weight:bold;cursor:pointer;font-family:inherit}
  .viewlink{display:block;text-align:center;margin-top:14px;background:#fff;color:var(--accent);border:2px solid var(--accent);border-radius:999px;padding:12px;font-weight:bold;text-decoration:none}
  .msg{font-size:.9rem;color:#3f7a4d;text-align:center;margin-top:10px;min-height:1.4em}
  .back{display:block;text-align:center;margin-top:22px;color:var(--soft)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>プロフィール編集</h1>
    <p class="sub">ここで書いた内容が、あなたの紹介ページに表示されます。</p>
  </header>

  <div class="card" id="box-loading"><p>ログイン状態を確認しています…</p></div>

  <div class="card" id="box-needlogin" hidden>
    <p>プロフィールの編集にはログインが必要です。</p>
    <a class="viewlink" href="login.html">ログインページへ</a>
  </div>

  <div class="card" id="box-form" hidden>
    <p id="member-no" style="font-weight:bold;color:var(--accent);margin-bottom:6px"></p>
    <form id="profile-form">
      <label for="f-nickname">ニックネーム（公開名）</label>
      <input type="text" id="f-nickname" maxlength="40" placeholder="例：みかんママ">
      <p class="hint">紹介ページと掲示板に表示される名前です。本名でなくて大丈夫です。</p>

      <label>区分（当てはまるもの全部）</label>
      <div class="checks">
        <label><input type="checkbox" id="c-hito" value="ヒト">ヒト</label>
        <label><input type="checkbox" id="c-mono" value="モノ">モノ</label>
        <label><input type="checkbox" id="c-koto" value="コト">コト</label>
      </div>
      <p class="hint">人・モノ・活動、全部当てはまる方は全部選んでください。</p>

      <label for="f-area">地域</label>
      <input type="text" id="f-area" maxlength="40" placeholder="例：松山市">

      <label for="f-intro">紹介文</label>
      <textarea id="f-intro" maxlength="600" placeholder="あなたやお店・活動の紹介を書いてください"></textarea>

      <label for="f-seekhito">探しているヒト（こんな人）</label>
      <input type="text" id="f-seekhito" maxlength="200" placeholder="例：フリマ出店仲間、子育て中のママ友">
      <label for="f-seekmono">探しているモノ（こんなもの）</label>
      <input type="text" id="f-seekmono" maxlength="200" placeholder="例：子ども服のおさがり、男の子の自転車">
      <label for="f-seekkoto">探しているコト（こんなこと）</label>
      <input type="text" id="f-seekkoto" maxlength="200" placeholder="例：一緒にイベントを盛り上げてくれる団体">
      <p class="hint">探しているものは、紹介ページに表示されます。空欄でも大丈夫です。</p>

      <label for="f-offering">提供できること・ゆずれるもの</label>
      <textarea id="f-offering" maxlength="600" placeholder="例：着なくなった子ども服があります／スマホの使い方なら教えられます"></textarea>

      <label for="f-hp">ホームページのURL（あれば）</label>
      <input type="url" id="f-hp" placeholder="https://">

      <label for="f-sns">SNSのリンク（あれば）</label>
      <textarea id="f-sns" maxlength="400" placeholder="Instagram・Threads・Facebook・LINEなどのURLを貼ってください（複数OK）"></textarea>

      <label for="f-menu">メニュー・料金ページのURL（あれば）</label>
      <input type="url" id="f-menu" placeholder="https://">

      <button class="savebtn" type="submit">保存する</button>
      <p class="msg" id="save-msg"></p>
      <a class="viewlink" id="view-own" href="#" hidden>自分の紹介ページを見る →</a>
    </form>
  </div>

  <a class="back" href="index.html">トップページへ戻る</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCao64N8dfQoXBmsMHIDpLpQwQyXp-2iw0",
  authDomain: "ohana-share.firebaseapp.com",
  projectId: "ohana-share",
  storageBucket: "ohana-share.firebasestorage.app",
  messagingSenderId: "825904150210",
  appId: "1:825904150210:web:4ae90f047ac8cc761cad5b"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var uid = null;
function $(id){ return document.getElementById(id); }
auth.onAuthStateChanged(function(user){
  $('box-loading').hidden = true;
  if(!user){ $('box-needlogin').hidden = false; return; }
  uid = user.uid;
  $('box-form').hidden = false;
  var view = $('view-own');
  view.href = 'member.html?id=' + uid;
  view.hidden = false;
  db.collection('profiles').doc(uid).get().then(function(doc){
    if(!doc.exists) return;
    var d = doc.data();
    $('f-nickname').value = d.nickname || '';
    var dcats = d.categories || (d.category ? [d.category] : []);
    $('c-hito').checked = dcats.indexOf('ヒト') >= 0;
    $('c-mono').checked = dcats.indexOf('モノ') >= 0;
    $('c-koto').checked = dcats.indexOf('コト') >= 0;
    if(d.memberNo){ $('member-no').textContent = 'あなたのメンバーNo.： No.' + d.memberNo; }
    $('f-area').value = d.area || '';
    $('f-intro').value = d.intro || '';
    $('f-seekhito').value = d.seekingHito || d.seekingText || '';
    $('f-seekmono').value = d.seekingMono || '';
    $('f-seekkoto').value = d.seekingKoto || '';
    $('f-offering').value = d.offering || '';
    $('f-hp').value = d.hpUrl || '';
    $('f-sns').value = d.snsLinks || '';
    $('f-menu').value = d.menuUrl || '';
  });
});
$('profile-form').addEventListener('submit', function(e){
  e.preventDefault();
  if(!uid) return;
  var cats = [];
  if($('c-hito').checked) cats.push('ヒト');
  if($('c-mono').checked) cats.push('モノ');
  if($('c-koto').checked) cats.push('コト');
  var data = {
    nickname: $('f-nickname').value.trim(),
    categories: cats,
    area: $('f-area').value.trim(),
    intro: $('f-intro').value.trim(),
    seekingHito: $('f-seekhito').value.trim(),
    seekingMono: $('f-seekmono').value.trim(),
    seekingKoto: $('f-seekkoto').value.trim(),
    offering: $('f-offering').value.trim(),
    hpUrl: $('f-hp').value.trim(),
    snsLinks: $('f-sns').value.trim(),
    menuUrl: $('f-menu').value.trim(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  $('save-msg').textContent = '保存しています…';
  var ref = db.collection('profiles').doc(uid);
  ref.get().then(function(doc){
    if(doc.exists && doc.data().memberNo){
      return ref.set(data, {merge:true});
    }
    // 初めての保存：メンバーNo.を採番する
    var counterRef = db.collection('counters').doc('members');
    return db.runTransaction(function(tx){
      return tx.get(counterRef).then(function(cdoc){
        var next = cdoc.exists ? (cdoc.data().next || 1) : 1;
        data.memberNo = next;
        tx.update(counterRef, {next: next + 1});
        tx.set(ref, data, {merge:true});
      });
    });
  }).then(function(){
    if(data.memberNo){ $('member-no').textContent = 'あなたのメンバーNo.： No.' + data.memberNo; }
    $('save-msg').textContent = '保存しました。紹介ページに反映されています。';
  }).catch(function(){
    $('save-msg').textContent = '保存できませんでした。時間をおいて試してください。';
  });
});
</script>
</body>
</html>
