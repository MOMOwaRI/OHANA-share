<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール編集｜OHANAシェア＊プロジェクト</title>
<link rel="canonical" href="https://momowari.github.io/OHANA-share/mypage.html">
<link rel="icon" href="favicon.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q979YZ2WCW"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-Q979YZ2WCW');</script>
<style>
  :root{--ink:#3a2e25;--paper:#fff9f2;--card:#fff;--line:#f3ddc4;--soft:#8a6a4f;--accent:#e07b24;--hito:#f6c3d5;--mono:#bfe6cf;--koto:#fbe38e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;background:var(--paper);color:var(--ink);line-height:1.8}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}
  header{text-align:center;padding:28px 0 4px}
  h1{font-size:1.45rem}
  .sub{color:var(--soft);font-size:.92rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:16px}
  .tabs{display:flex;gap:8px;margin-bottom:6px}
  .tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 4px;font-weight:bold;font-family:inherit;font-size:1rem;cursor:pointer;color:var(--ink)}
  .tabs button.on-hito{background:var(--hito);border-color:#e58bb0}
  .tabs button.on-mono{background:var(--mono);border-color:#7cc79c}
  .tabs button.on-koto{background:var(--koto);border-color:#ecc94b}
  .status{font-size:.85rem;color:var(--soft);text-align:center;margin-top:8px}
  label{display:block;font-weight:bold;margin:16px 0 4px}
  label:first-of-type{margin-top:0}
  .hint{font-size:.82rem;color:var(--soft);font-weight:normal}
  input[type=text],input[type=url],textarea{width:100%;border:1px solid #e5cfae;border-radius:10px;padding:10px;font-size:.95rem;font-family:inherit;background:#fffdf9}
  textarea{min-height:84px}
  .savebtn{display:block;width:100%;margin-top:22px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px;font-size:1rem;font-weight:bold;cursor:pointer;font-family:inherit}
  .viewlink{display:block;text-align:center;margin-top:14px;background:#fff;color:var(--accent);border:2px solid var(--accent);border-radius:999px;padding:12px;font-weight:bold;text-decoration:none}
  .msg{font-size:.9rem;color:#3f7a4d;text-align:center;margin-top:10px;min-height:1.4em}
  .back{display:block;text-align:center;margin-top:22px;color:var(--soft)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>プロフィール編集</h1>
    <p class="sub">区分ごとに紹介ページを作れます。ヒト・モノ・コト、当てはまる区分だけ作れば大丈夫です。</p>
  </header>

  <div class="card" id="box-loading"><p>ログイン状態を確認しています…</p></div>

  <div class="card" id="box-needlogin" hidden>
    <p>プロフィールの編集にはログインが必要です。</p>
    <a class="viewlink" href="login.html">ログインページへ</a>
  </div>

  <div class="card" id="box-form" hidden>
    <div class="tabs">
      <button type="button" id="tab-hito">ヒト</button>
      <button type="button" id="tab-mono">モノ</button>
      <button type="button" id="tab-koto">コト</button>
    </div>
    <p class="status" id="role-status"></p>
    <p id="member-no" style="font-weight:bold;color:var(--accent);margin:8px 0 2px"></p>
    <form id="profile-form">
      <label for="f-nickname">このページの名前（公開名）</label>
      <input type="text" id="f-nickname" maxlength="40" placeholder="例：みかんママ">
      <p class="hint">区分ごとに違う名前で大丈夫です（例：ヒト＝個人の名前、モノ＝お店の名前）。</p>

      <label for="f-area">地域</label>
      <input type="text" id="f-area" maxlength="40" placeholder="例：松山市">

      <label for="f-intro">紹介文</label>
      <textarea id="f-intro" maxlength="600" placeholder="この区分での、あなたやお店・活動の紹介を書いてください"></textarea>

      <label for="f-seekhito">探しているヒト（こんな人）</label>
      <input type="text" id="f-seekhito" maxlength="200" placeholder="例：フリマ出店仲間、子育て中のママ友">
      <label for="f-seekmono">探しているモノ（こんなもの）</label>
      <input type="text" id="f-seekmono" maxlength="200" placeholder="例：子ども服のおさがり、男の子の自転車">
      <label for="f-seekkoto">探しているコト（こんなこと）</label>
      <input type="text" id="f-seekkoto" maxlength="200" placeholder="例：一緒にイベントを盛り上げてくれる団体">
      <p class="hint">探しているものは、紹介ページに表示されます。空欄でも大丈夫です。</p>

      <label for="f-offering">提供できること・ゆずれるもの</label>
      <textarea id="f-offering" maxlength="600" placeholder="例：着なくなった子ども服があります／スマホの使い方なら教えられます"></textarea>

      <label for="f-hp">ホームページのURL（あれば）</label>
      <input type="url" id="f-hp" placeholder="https://">

      <label for="f-sns">SNSのリンク（あれば）</label>
      <textarea id="f-sns" maxlength="400" placeholder="SNSのURLを貼ってください（複数OK）"></textarea>

      <label for="f-menu">メニュー・料金ページのURL（あれば）</label>
      <input type="url" id="f-menu" placeholder="https://">

      <button class="savebtn" type="submit">この区分で保存する</button>
      <p class="msg" id="save-msg"></p>
      <a class="viewlink" id="view-own" href="#" hidden>この区分の紹介ページを見る →</a>
    </form>
  </div>

  <a class="back" href="index.html">トップページへ戻る</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCao64N8dfQoXBmsMHIDpLpQwQyXp-2iw0",
  authDomain: "ohana-share.firebaseapp.com",
  projectId: "ohana-share",
  storageBucket: "ohana-share.firebasestorage.app",
  messagingSenderId: "825904150210",
  appId: "1:825904150210:web:4ae90f047ac8cc761cad5b"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var uid = null;
var ROLES = {hito:'ヒト', mono:'モノ', koto:'コト'};
var NAME_PH = {hito:'例：みかんママ', mono:'例：雑貨屋〇〇', koto:'例：〇〇サロン'};
var currentRole = 'hito';
var cache = {hito:null, mono:null, koto:null};
var legacy = null;
function $(id){ return document.getElementById(id); }
function docId(role){ return uid + '__' + role; }

function fillForm(d){
  $('f-nickname').value = d ? (d.nickname || '') : '';
  $('f-area').value = d ? (d.area || '') : '';
  $('f-intro').value = d ? (d.intro || '') : '';
  $('f-seekhito').value = d ? (d.seekingHito || d.seekingText || '') : '';
  $('f-seekmono').value = d ? (d.seekingMono || '') : '';
  $('f-seekkoto').value = d ? (d.seekingKoto || '') : '';
  $('f-offering').value = d ? (d.offering || '') : '';
  $('f-hp').value = d ? (d.hpUrl || '') : '';
  $('f-sns').value = d ? (d.snsLinks || '') : '';
  $('f-menu').value = d ? (d.menuUrl || '') : '';
  if(d && d.memberNo){ $('member-no').textContent = 'このページのメンバーNo.： No.' + d.memberNo; }
  else { $('member-no').textContent = '保存すると、このページにメンバーNo.が付きます。'; }
  $('f-nickname').placeholder = NAME_PH[currentRole];
  var view = $('view-own');
  view.href = 'member.html?id=' + docId(currentRole);
  view.hidden = !(d && d.nickname);
  $('save-msg').textContent = '';
}
function statusText(){
  var parts = [];
  ['hito','mono','koto'].forEach(function(r){
    var d = cache[r];
    parts.push(ROLES[r] + '：' + (d ? ('作成済み' + (d.memberNo ? '（No.' + d.memberNo + '）' : '')) : 'まだ'));
  });
  $('role-status').textContent = parts.join('　');
}
function selectRole(role){
  currentRole = role;
  ['hito','mono','koto'].forEach(function(r){
    $('tab-' + r).className = (r === role) ? ('on-' + r) : '';
  });
  fillForm(cache[role]);
  statusText();
}
['hito','mono','koto'].forEach(function(r){
  $('tab-' + r).addEventListener('click', function(){ selectRole(r); });
});

auth.onAuthStateChanged(function(user){
  $('box-loading').hidden = true;
  if(!user){ $('box-needlogin').hidden = false; return; }
  uid = user.uid;
  $('box-form').hidden = false;
  var jobs = ['hito','mono','koto'].map(function(r){
    return db.collection('profiles').doc(docId(r)).get().then(function(doc){
      cache[r] = doc.exists ? doc.data() : null;
    });
  });
  jobs.push(db.collection('profiles').doc(uid).get().then(function(doc){
    legacy = doc.exists ? doc.data() : null;
    // 旧形式（区分分け前）のプロフィールは、ヒトのページとして引き継ぐ
    if(legacy && !cache.hito){ cache.hito = legacy; }
  }));
  Promise.all(jobs).then(function(){ selectRole('hito'); });
});

$('profile-form').addEventListener('submit', function(e){
  e.preventDefault();
  if(!uid) return;
  var role = currentRole;
  var data = {
    nickname: $('f-nickname').value.trim(),
    categories: [ROLES[role]],
    area: $('f-area').value.trim(),
    intro: $('f-intro').value.trim(),
    seekingHito: $('f-seekhito').value.trim(),
    seekingMono: $('f-seekmono').value.trim(),
    seekingKoto: $('f-seekkoto').value.trim(),
    offering: $('f-offering').value.trim(),
    hpUrl: $('f-hp').value.trim(),
    snsLinks: $('f-sns').value.trim(),
    menuUrl: $('f-menu').value.trim(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  var keepNo = (cache[role] && cache[role].memberNo) || (role === 'hito' && legacy && legacy.memberNo) || null;
  $('save-msg').textContent = '保存しています…';
  var ref = db.collection('profiles').doc(docId(role));
  var p;
  if(keepNo){
    data.memberNo = keepNo;
    p = ref.set(data, {merge:true});
  } else {
    var counterRef = db.collection('counters').doc('members');
    p = db.runTransaction(function(tx){
      return tx.get(counterRef).then(function(cdoc){
        var next = cdoc.exists ? (cdoc.data().next || 1) : 1;
        data.memberNo = next;
        tx.update(counterRef, {next: next + 1});
        tx.set(ref, data, {merge:true});
      });
    });
  }
  p.then(function(){
    cache[role] = data;
    $('member-no').textContent = 'このページのメンバーNo.： No.' + data.memberNo;
    $('save-msg').textContent = '保存しました。紹介ページに反映されています。';
    var view = $('view-own');
    view.href = 'member.html?id=' + docId(role);
    view.hidden = false;
    statusText();
  }).catch(function(){
    $('save-msg').textContent = '保存できませんでした。時間をおいて試してください。';
  });
});
</script>
</body>
</html>
