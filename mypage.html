<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自分のページ一覧｜OHANAシェア＊プロジェクト</title>
<link rel="canonical" href="https://momowari.github.io/OHANA-share/mypage.html">
<link rel="icon" href="favicon.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q979YZ2WCW"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-Q979YZ2WCW');</script>
<style>
  :root{--orange:#e07b24;--orange-dark:#c2610f;--ink:#3a2e25;--paper:#fff9f2;--card:#fff;--line:#f3ddc4;--soft:#8a6a4f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;background:var(--paper);color:var(--ink);line-height:1.8}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}
  header{text-align:center;padding:28px 0 8px}
  h1{font-size:1.7rem;letter-spacing:.03em}
  .sub{color:var(--soft);font-size:.92rem}
  .badge{display:inline-block;border-radius:999px;padding:2px 14px;font-size:.85rem;font-weight:bold;color:#4a3418}
  .cat-hito{background:#f6c3d5}.cat-mono{background:#bfe6cf}.cat-koto{background:#fbe38e}
  .page-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .page-card .nm{font-weight:bold;font-size:1.1rem;flex:1;min-width:140px}
  .page-card .no{color:var(--soft);font-size:.88rem}
  .open-btn{background:var(--orange);color:#fff;font-weight:bold;text-decoration:none;border-radius:999px;padding:10px 20px}
  .create-card{background:#fffdf9;border:2px dashed #e8b96f;border-radius:16px;padding:16px 20px;margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .create-card .nm{flex:1;min-width:140px;color:var(--soft)}
  .create-btn{background:#fff;color:var(--orange-dark);border:2px solid var(--orange);font-weight:bold;border-radius:999px;padding:9px 20px;cursor:pointer;font-family:inherit;font-size:.95rem}
  .del-btn{background:#fff;color:#b03a3a;border:1.5px solid #d99;background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:bold}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
  .cta{display:block;text-align:center;background:#fff;color:var(--orange-dark);border:2px solid var(--orange);font-weight:bold;text-decoration:none;border-radius:999px;padding:13px;margin-top:16px}
  .banner-sm{width:min(340px,86%);display:block;margin:24px auto 2px;border-radius:10px;border:1.5px solid #e8cdb0;background:#fff}
  footer{text-align:center;margin-top:16px;font-size:.85rem;color:var(--soft)}
  footer img{width:90px;display:block;margin:0 auto 8px}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="img-992cf83a89.png" alt="OHANAキャラクター" style="width:110px">
    <h1>自分のページ一覧</h1>
    <p class="sub">ページを開くと、その場で文字を直して編集できます。1人で複数のページを持てます。</p>
  </header>

  <div id="login-needed" hidden>
    <section><p>ログインが必要です。</p></section>
    <a class="cta" href="login.html">ログインページへ</a>
  </div>

  <div id="pages-area" hidden>
    <div id="pages-list"></div>
    <div id="create-list"></div>
    <p class="sub" id="hub-msg" style="margin-top:12px"></p>
  </div>

  <a class="cta" href="board.html">みんなの掲示板へ</a>
  <a class="cta" href="index.html">OHANAトップへ戻る</a>

  <a href="index.html"><img class="banner-sm" src="member-banner.png" alt="OHANAシェア＊プロジェクト"></a>
  <footer>
    <img src="img-992cf83a89.png" alt="OHANAキャラクター">
    OHANAシェア＊プロジェクト
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCao64N8dfQoXBmsMHIDpLpQwQyXp-2iw0",
  authDomain: "ohana-share.firebaseapp.com",
  projectId: "ohana-share",
  storageBucket: "ohana-share.firebasestorage.app",
  messagingSenderId: "825904150210",
  appId: "1:825904150210:web:4ae90f047ac8cc761cad5b"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
function $(id){ return document.getElementById(id); }
function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function catCls(c){ return c === 'ヒト' ? 'cat-hito' : c === 'モノ' ? 'cat-mono' : 'cat-koto'; }
var uid = null;

function card(docId, d){
  var cats = d.categories || (d.category ? [d.category] : []);
  var bh = '';
  cats.forEach(function(c){ bh += '<span class="badge ' + catCls(c) + '">' + esc(c) + '</span> '; });
  return '<div class="page-card">' + bh + '<span class="nm">' + esc(d.nickname || '（名前はまだ）') + '</span>' +
    (d.memberNo ? '<span class="no">No.' + d.memberNo + '</span>' : '') +
    '<a class="open-btn" href="member.html?id=' + encodeURIComponent(docId) + '&edit=1">このページを編集</a>' +
    '<button type="button" class="del-btn" data-doc="' + esc(docId) + '" data-name="' + esc(d.nickname || '（名前はまだ）') + '">削除</button></div>';
}
function createCard(cat, docId){
  return '<div class="create-card"><span class="badge ' + catCls(cat) + '">' + cat + '</span><span class="nm">' + cat + 'のページはまだありません</span>' +
    '<button type="button" class="create-btn" data-cat="' + cat + '" data-doc="' + docId + '">' + cat + 'のページを作る</button></div>';
}

function loadPages(){
  var slots = [
    {docId: uid, cat: 'ヒト'},
    {docId: uid + '__hito', cat: 'ヒト'},
    {docId: uid + '__mono', cat: 'モノ'},
    {docId: uid + '__koto', cat: 'コト'}
  ];
  var seenCat = {};
  var cards = '', creates = '';
  var jobs = slots.map(function(s){
    return db.collection('profiles').doc(s.docId).get().then(function(doc){
      return {slot: s, doc: doc};
    });
  });
  Promise.all(jobs).then(function(results){
    results.forEach(function(r){
      if(r.doc.exists){
        cards += card(r.slot.docId, r.doc.data());
        seenCat[r.slot.cat] = true;
      }
    });
    ['ヒト','モノ','コト'].forEach(function(cat){
      if(!seenCat[cat]){
        var docId = uid + '__' + (cat === 'ヒト' ? 'hito' : cat === 'モノ' ? 'mono' : 'koto');
        creates += createCard(cat, docId);
      }
    });
    $('pages-list').innerHTML = cards || '<section><p>まだページがありません。下から作ってください。</p></section>';
    $('create-list').innerHTML = creates;
    document.querySelectorAll('.create-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ createPage(btn.getAttribute('data-cat'), btn.getAttribute('data-doc')); });
    });
    document.querySelectorAll('.del-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var docId = btn.getAttribute('data-doc');
        var nm = btn.getAttribute('data-name');
        if(!confirm('「' + nm + '」のページを削除しますか？\n元に戻せません。メンバーNo.は空き番号として、次の人が使えるようになります。')) return;
        $('hub-msg').textContent = '削除しています…';
        var pageRef = db.collection('profiles').doc(docId);
        var counterRef = db.collection('counters').doc('members');
        pageRef.get().then(function(pdoc){
          var no = pdoc.exists ? pdoc.data().memberNo : null;
          if(!no){ return pageRef.delete(); }
          return db.runTransaction(function(tx){
            return tx.get(counterRef).then(function(cdoc){
              var free = (cdoc.exists && cdoc.data().free) || [];
              if(free.indexOf(no) < 0){ free.push(no); free.sort(function(a,b){ return a - b; }); }
              tx.update(counterRef, {free: free});
              tx.delete(pageRef);
            });
          });
        }).then(function(){
          $('hub-msg').textContent = '削除しました。';
          loadPages();
        }).catch(function(){
          $('hub-msg').textContent = '削除できませんでした。時間をおいて試してください。';
        });
      });
    });
  });
}

function createPage(cat, docId){
  $('hub-msg').textContent = cat + 'のページを作っています…';
  var counterRef = db.collection('counters').doc('members');
  var pageRef = db.collection('profiles').doc(docId);
  db.runTransaction(function(tx){
    return tx.get(counterRef).then(function(cdoc){
      var cdata = cdoc.exists ? cdoc.data() : {};
      var next = cdata.next ? cdata.next : 1;
      var free = cdata.free || [];
      var no;
      if(free.length){
        no = Math.min.apply(null, free);
        tx.update(counterRef, {free: free.filter(function(x){ return x !== no; })});
      } else {
        no = next;
        tx.update(counterRef, {next: next + 1});
      }
      tx.set(pageRef, {
        nickname: '', area: '', categories: [cat], intro: '',
        seekingHito: '', seekingMono: '', seekingKoto: '', offering: '',
        hpUrl: '', menuUrl: '', snsLinks: '',
        memberNo: no,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return no;
    });
  }).then(function(no){
    $('hub-msg').textContent = 'No.' + no + ' で作りました。ページへ移動します…';
    location.href = 'member.html?id=' + encodeURIComponent(docId) + '&edit=1';
  }).catch(function(){
    $('hub-msg').textContent = '作れませんでした。時間をおいて試してください。';
  });
}

auth.onAuthStateChanged(function(user){
  if(!user){ $('login-needed').hidden = false; return; }
  uid = user.uid;
  $('pages-area').hidden = false;
  loadPages();
});
</script>
</body>
</html>
