<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さくら姫 AI分身｜無料チャット占い</title>
<meta name="description" content="松山市の占い師・さくら姫（津野広美）のAI分身と話せる無料チャット。ご縁結び鑑定のさくら姫の言葉で、やさしく背中を押します。">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fdf3f5; color: #4a3040; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(135deg, #f8c8d8, #fbe9ef); padding: 18px 16px 14px; text-align: center; border-bottom: 2px solid #f3a8c0; }
  header h1 { font-size: 1.35rem; color: #a03a5f; letter-spacing: .05em; }
  header p { font-size: .82rem; margin-top: 6px; color: #7a4a5e; line-height: 1.5; }
  .badge { display: inline-block; background: #fff; border: 1px solid #f3a8c0; color: #a03a5f; border-radius: 999px; padding: 3px 12px; font-size: .78rem; margin-top: 8px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 12px; max-width: 720px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; margin: 8px 0; line-height: 1.65; font-size: .95rem; white-space: pre-wrap; word-break: break-word; }
  .ai { background: #fff; border: 1px solid #f6cfdd; border-bottom-left-radius: 4px; margin-right: auto; }
  .me { background: #f8c8d8; border-bottom-right-radius: 4px; margin-left: auto; }
  .sys { text-align: center; font-size: .78rem; color: #a3768c; margin: 10px auto; }
  .guide { background: #fff7fa; border: 2px solid #f3a8c0; border-radius: 16px; padding: 14px; margin: 12px 0; line-height: 1.65; font-size: .93rem; }
  .guide a.btn { display: block; text-align: center; background: #d1567f; color: #fff; text-decoration: none; border-radius: 999px; padding: 12px; margin-top: 10px; font-weight: bold; }
  #bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #f6cfdd; padding: 10px; }
  #bar .in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  #q { flex: 1; border: 1px solid #e5b7c8; border-radius: 999px; padding: 12px 16px; font-size: 1rem; outline: none; }
  #send { background: #d1567f; color: #fff; border: none; border-radius: 999px; padding: 0 20px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  #send:disabled { opacity: .5; }
  footer { text-align: center; font-size: .72rem; color: #b08a9c; padding: 8px; }
</style>
</head>
<body>
<header>
  <h1>🌸 さくら姫 AI分身 🌸</h1>
  <p>松山市の占い師・さくら姫（津野広美）のAI分身です。<br>「占いはレッテルを貼るものじゃなく、剥がすもの」<br>無料で <b>3往復</b> までお話しできます。</p>
  <span class="badge" id="left">無料あと 3 往復</span>
</header>
<div id="chat">
  <div class="msg ai">はじめまして！さくら姫のAI分身です(^^♪

占い歴14年目、ご縁結び鑑定のさくら姫の言葉でお答えします♡

気になること、モヤモヤしていること、なんでも話してみてね。
一人で抱え込まなくて大丈夫！！</div>
</div>
<div id="bar">
  <div class="in">
    <input id="q" type="text" placeholder="相談を入力してね" autocomplete="off">
    <button id="send">送る</button>
  </div>
</div>
<footer>このAIは、さくら姫本人の言葉や考え方をもとに作られた分身です。詳しい鑑定は本人へ。</footer>

<script>
var FREE_LIMIT = 3;
var used = 0;
var busy = false;
var GUIDE_URL = "https://ws.formzu.net/dist/S827967370/";
var chatEl = document.getElementById('chat');
function addMsg(text, cls) {
  var d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}
function showGuide() {
  var d = document.createElement('div');
  d.className = 'guide';
  d.innerHTML = 'ここまでお話ししてくれてありがとう♡<br><br>AI分身の私でお伝えできるのは、ここまでになるの(^^♪<br>もっと深く自分の星を知りたいなと思ったら、さくら姫本人の鑑定も活用してみてね。<br>一人で抱え込まなくて大丈夫！！';
  var a = document.createElement('a');
  a.className = 'btn'; a.href = GUIDE_URL; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = 'さくら姫本人へのお申し込みはこちら';
  d.appendChild(a);
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  document.getElementById('left').textContent = '無料分はここまで。本人鑑定は上のボタンから';
  document.getElementById('q').disabled = true;
  document.getElementById('send').disabled = true;
}
function fallbackAnswer(q) {
  if (/病院|病気|痛い|めまい|動悸|診断/.test(q)) return 'それは不安だよね。さくら姫のAI分身です(^^♪\n\nお体の症状については、占いやAI分身では判断できないの。体からの大切なサインかもしれないから、早めに病院で先生に診てもらってね♡\n\n一人で我慢しないで大丈夫！！';
  if (/相性|結婚|彼|彼女|恋/.test(q)) return '大切なお話をしてくれてありがとう♡\n\n「私なんて」と自分にレッテルを貼らなくて大丈夫！！\n占いはレッテルを貼るものじゃなく、剥がすものだからね(^^♪\n\n詳しい相性は、お二人のホロスコープを重ねて見る本人鑑定だと、もっとハッキリ見えてくるよ。';
  return 'お話ししてくれてありがとう♡ さくら姫のAI分身です(^^♪\n\n今はAIの接続が混み合っていて、詳しいお返事ができないの。少し時間をおいて、もう一度話しかけてみてね。\n\nあなたには、あなたの花が開花する。大丈夫！！';
}
async function ask(q) {
  if (window.__geminiAskSakura) {
    try { return await Promise.race([window.__geminiAskSakura(q), new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, 30000); })]); } catch (e) { return fallbackAnswer(q); }
  }
  return fallbackAnswer(q);
}
async function send() {
  if (busy) return;
  var inp = document.getElementById('q');
  var q = inp.value.trim();
  if (!q) return;
  inp.value = '';
  addMsg(q, 'me');
  if (used >= FREE_LIMIT) { showGuide(); return; }
  busy = true;
  document.getElementById('send').disabled = true;
  var wait = addMsg('考え中です…♡', 'ai');
  var ans = await ask(q);
  wait.textContent = ans;
  used++;
  var left = FREE_LIMIT - used;
  document.getElementById('left').textContent = left > 0 ? ('無料あと ' + left + ' 往復') : '次で無料の案内が出ます';
  busy = false;
  document.getElementById('send').disabled = false;
  chatEl.scrollTop = chatEl.scrollHeight;
  if (used >= FREE_LIMIT) {
    var note = document.createElement('div');
    note.className = 'sys';
    note.textContent = '（無料でお話しできるのは、次に送ると案内が出ます）';
    chatEl.appendChild(note);
  }
}
document.getElementById('send').addEventListener('click', send);
document.getElementById('q').addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app-check.js";

try {
  var app = initializeApp({
  apiKey: "AIzaSyCao64N8dfQoXBmsMHIDpLpQwQyXp-2iw0",
  authDomain: "ohana-share.firebaseapp.com",
  projectId: "ohana-share",
  storageBucket: "ohana-share.firebasestorage.app",
  messagingSenderId: "825904150210",
  appId: "1:825904150210:web:4ae90f047ac8cc761cad5b"
});
  try { initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider("6LfLJwcuAAAAAJk3CSivW9C-9E0Q-Cexl9wwibrv"), isTokenAutoRefreshEnabled: true }); } catch (e) {}
  var model = getGenerativeModel(getAI(app, { backend: new GoogleAIBackend() }), { model: "gemini-3.5-flash-lite", systemInstruction: SYS });
  var chat = null;
  window.__geminiAskSakura = async function(q) {

  };

</script>
