<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOTの記録｜本人用ページ</title>
<meta name="robots" content="noindex">
<style>
body { font-family: sans-serif; margin: 0; background: #fff8ef; color: #333; }
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 8px 0 4px; }
.sub { color: #777; font-size: 13px; margin-bottom: 16px; }
button { font-size: 15px; padding: 10px 18px; border: none; border-radius: 999px; background: #0068B7; color: #fff; cursor: pointer; }
button.sub2 { background: #eee; color: #333; }
.card { background: #fff; border: 1px solid #eadfce; border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
.card .d { color: #999; font-size: 12px; margin-bottom: 6px; }
.card .q { font-weight: bold; margin-bottom: 6px; white-space: pre-wrap; }
.card .a { white-space: pre-wrap; color: #444; }
.note { background: #fff; border: 1px dashed #d8c9a8; border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.req { background: #fff; border: 1px solid #eadfce; border-radius: 12px; padding: 10px 14px; margin: 8px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
<h1 id="title">BOTの記録</h1>
<div class="sub">本人だけが見られるページです。Googleログインが必要です。</div>
<div id="main"><p>読み込み中…</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app-check.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

var BOTS = {
  sakurahime: { label: "さくら姫 AI分身", page: "/OHANA-share/bunshin/sakurahime.html" },
  momowari: { label: "MOMOwaRI AI分身", page: "/OHANA-share/bunshin/momowari.html" }
};
var EDITOR = "ELCzyeeoDCU4gveavc077L4jBqE3";
var params = new URLSearchParams(location.search);
var botKey = BOTS[params.get("bot")] ? params.get("bot") : "sakurahime";
var BOT = BOTS[botKey];
document.getElementById("title").textContent = BOT.label + "｜会話の記録";

var app = initializeApp({
  apiKey: "AIzaSyCao64N8dfQoXBmsMHIDpLpQwQyXp-2iw0",
  authDomain: "ohana-share.firebaseapp.com",
  projectId: "ohana-share",
  storageBucket: "ohana-share.firebasestorage.app",
  messagingSenderId: "825904150210",
  appId: "1:825904150210:web:4ae90f047ac8cc761cad5b"
});
try { initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider("6LfLJwcuAAAAAJk3CSivW9C-9E0Q-Cexl9wwibrv"), isTokenAutoRefreshEnabled: true }); } catch (e) {}
var auth = getAuth(app);
var db = getFirestore(app);
var main = document.getElementById("main");

function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(ts) { try { var d = ts && ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString("ja-JP"); } catch (e) { return ""; } }

async function editSection() {
  var s = await getDoc(doc(db, "botSettings", botKey));
  var d = s.exists() ? s.data() : {};
  return "<div class='note'><b>設定の編集</b><br>無料で話せる往復数：<input id='eFree' type='number' min='1' max='200' value='" + (d.freeLimit || 20) + "' style='width:70px;font-size:15px;'><br>本人への案内URL：<input id='eUrl' type='text' value='" + esc(d.guideUrl || "") + "' style='width:100%;font-size:14px;box-sizing:border-box;'><br><button id='eSave'>保存する</button> <span id='eMsg'></span></div>";
}
function bindSave() {
  var b = document.getElementById("eSave");
  if (!b) return;
  b.addEventListener("click", async function() {
    var f = parseInt(document.getElementById("eFree").value, 10);
    var u = document.getElementById("eUrl").value.trim();
    var data = {};
    if (f > 0) data.freeLimit = f;
    if (u) data.guideUrl = u;
    await setDoc(doc(db, "botSettings", botKey), data, { merge: true });
    document.getElementById("eMsg").textContent = "保存しました。分身ページに反映されます。";
  });
}

async function renderLogs() {
  var q = query(collection(db, "botLogs"), where("page", "==", BOT.page), orderBy("ts", "desc"), limit(100));
  var snap = await getDocs(q);
  var eh = await editSection();
  if (snap.empty) { main.innerHTML = eh + "<div class='note'>まだ記録がありません。会話があると、ここに並びます。</div>"; bindSave(); return; }
  var h = eh;
  snap.forEach(function(d) { var v = d.data(); h += "<div class='card'><div class='d'>" + esc(fmt(v.ts)) + "</div><div class='q'>" + esc(v.q) + "</div><div class='a'>" + esc(v.a) + "</div></div>"; });
  main.innerHTML = h;
  bindSave();
}

async function renderEditor(user) {
  var eh = await editSection();
  var h = "<div class='note'>管理者としてログイン中です。このBOTの記録と、承認待ちの申請を表示します。</div>" + eh + "<h3>承認待ちの申請</h3><div id='reqs'>読み込み中…</div><h3>記録</h3><div id='logs'></div>";
  main.innerHTML = h;
  bindSave();
  var rs = await getDocs(collection(db, "botViewerRequests"));
  var rh = "";
  var n = 0;
  rs.forEach(function(d) { var v = d.data(); if (v.bot !== botKey) return; n++; rh += "<div class='req'>" + esc(v.email) + "（" + esc(v.bot) + "） <button data-approve='" + d.id + "' data-email='" + esc(v.email) + "'>承認する</button></div>"; });
  document.getElementById("reqs").innerHTML = n ? rh : "<p>申請はありません。</p>";
  document.querySelectorAll("[data-approve]").forEach(function(b) {
    b.addEventListener("click", async function() {
      var uid = b.getAttribute("data-approve");
      await setDoc(doc(db, "botViewers", uid), { bot: botKey, page: BOT.page, email: b.getAttribute("data-email") });
      await deleteDoc(doc(db, "botViewerRequests", uid));
      b.parentElement.textContent = "承認しました。本人が次に開くと記録が見られます。";
    });
  });
  var logsEl = document.getElementById("logs");
  var q = query(collection(db, "botLogs"), where("page", "==", BOT.page), orderBy("ts", "desc"), limit(100));
  var snap = await getDocs(q);
  var lh = "";
  snap.forEach(function(d) { var v = d.data(); lh += "<div class='card'><div class='d'>" + esc(fmt(v.ts)) + "</div><div class='q'>" + esc(v.q) + "</div><div class='a'>" + esc(v.a) + "</div></div>"; });
  logsEl.innerHTML = lh || "<p>まだ記録がありません。</p>";
}

onAuthStateChanged(auth, async function(user) {
  if (!user) {
    main.innerHTML = "<div class='note'>このページは、BOTの本人だけが見られます。<br>ログインは、いつものOHANAのログインページでしてください。ログインできたら、このページに戻ってきてください。</div><p><a href='https://momowari.github.io/OHANA-share/' style='display:inline-block;font-size:15px;padding:10px 18px;border-radius:999px;background:#0068B7;color:#fff;text-decoration:none;'>ログイン</a></p>";
    return;
  }
  if (user.uid === EDITOR) { renderEditor(user); return; }
  var v = await getDoc(doc(db, "botViewers", user.uid));
  if (v.exists() && v.data().page === BOT.page) { renderLogs(); return; }
  var r = await getDoc(doc(db, "botViewerRequests", user.uid));
  if (r.exists()) {
    main.innerHTML = "<div class='note'>申請を受け付けました（" + esc(user.email) + "）。<br>承認されると、このページで記録が見られるようになります。</div>";
    return;
  }
  main.innerHTML = "<div class='note'>ログイン中：" + esc(user.email) + "<br>このBOTの本人であれば、閲覧を申請してください。承認後に記録が見られます。</div><p><button id='apply'>閲覧を申請する</button> <button class='sub2' id='logout'>ログアウト</button></p>";
  document.getElementById("apply").addEventListener("click", async function() {
    await setDoc(doc(db, "botViewerRequests", user.uid), { email: user.email || "", bot: botKey, page: BOT.page, ts: Date.now() });
    main.innerHTML = "<div class='note'>申請しました。承認されると、このページで記録が見られるようになります。</div>";
  });
  document.getElementById("logout").addEventListener("click", function() { signOut(auth); });
});
</script>
</body>
</html>
