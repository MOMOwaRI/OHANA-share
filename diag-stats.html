  projectId: "ohana-share",

var db = firebase.firestore();
var HZ = 'HzQqVRybTnWYXHsacO9Xhyrkecp1';

db.collection('profiles').doc(HZ).get().then(function(d){ log('T1 profiles get OK exists=' + d.exists); }).catch(function(e){ log('T1 profiles get ERR ' + (e && e.code) + ' ' + (e && e.message)); });

db.collection('itemStats').doc('gloomy-chidori').get().then(function(d){ log('T3 itemStats-gloomy get OK exists=' + d.exists + ' views=' + (d.exists ? d.data().views : '-')); }).catch(function(e){ log('T3 ERR ' + (e && e.code) + ' ' + (e && e.message)); });

  var ref = db.collection('itemStats').doc(HZ);
