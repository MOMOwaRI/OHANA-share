<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雑貨屋 Lea Mahalo｜OHANAシェア＊プロジェクト メンバーページ</title>
<link rel="icon" href="../favicon.png">
<style>
  :root{--orange:#e07b24;--orange-dark:#c2610f;--ink:#3a2e25;--paper:#fff9f2;--card:#ffffff;--line:#f3ddc4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:var(--paper);color:var(--ink);line-height:1.8}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}
  header{text-align:center;padding:36px 0 8px}
  header img.hero{width:150px}
  .badge{display:inline-block;background:var(--orange);color:#fff;border-radius:999px;padding:2px 14px;font-size:.85rem;font-weight:bold;letter-spacing:.08em}
  h1{font-size:1.7rem;margin:10px 0 2px}
  .sub{color:#8a6a4f;font-size:.95rem}
  .tags{margin:12px 0 4px}
  .tag{display:inline-block;background:#fdeeda;border:1px solid var(--line);border-radius:999px;padding:1px 12px;margin:2px;font-size:.85rem}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
  h2{font-size:1.1rem;color:var(--orange-dark);margin-bottom:8px}
  ul{padding-left:1.2em}
  .sns{display:flex;flex-direction:column;gap:10px}
  .sns a{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);background:#fffdf9}
  .sns a b{color:var(--orange-dark)}
  .sns a span{display:block;font-size:.85rem;color:#8a6a4f}
  .cta{display:block;text-align:center;background:var(--orange);color:#fff;font-weight:bold;text-decoration:none;border-radius:999px;padding:14px;margin-top:16px}
  .cta.sub2{background:#fff;color:var(--orange-dark);border:2px solid var(--orange)}
  footer{text-align:center;margin-top:28px;font-size:.85rem;color:#8a6a4f}
  footer img{width:90px;display:block;margin:0 auto 8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="hero" src="../img-18f35ef8fa.png" alt="OHANAキャラクター">
    <div><span class="badge">モノ</span></div>
    <h1>雑貨屋 Lea Mahalo</h1>
    <p class="sub">雑貨屋 ｜ 松山市（MAHALO美容室1階奥）</p>
    <div class="tags">
      <span class="tag">松山市</span><span class="tag">OHANAメンバー</span>
    </div>
  </header>

  <section>
    <h2>お店のこと</h2>
    <ul>
      <li>2011年オープンの小さな雑貨屋です</li>
      <li>雑貨・アクセサリー・フラワー雑貨などを扱っています</li>
      <li>メルカリでも出品しています</li>
    </ul>
  </section>

  <section>
    <h2>ひとこと</h2>
    <p>棚いっぱいの雑貨の中から、お気に入りを探してください。OHANAのイベントではフリマにも登場します。</p>
  </section>

  <a class="cta sub2" href="../index.html">OHANAトップへ戻る</a>

  <footer>
    <img src="../img-992cf83a89.png" alt="OHANAキャラクター">
    OHANAシェア＊プロジェクト メンバーページ<br>
    <a href="../index.html">トップページへ</a>
  </footer>
</div>
</body>
</html>
